name: Deploy LedgerFlow
on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: dotnet publish src/LedgerFlow -c Release -o out
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read the smoke-test key
        env:
          VAULT: ${{ vars.KEY_VAULT_NAME }}
        run: |
          KEY=$(az keyvault secret show --vault-name "$VAULT" \
            -n SmokeTestKey --query value -o tsv)
          echo "::add-mask::$KEY"
          test -n "$KEY"
          echo "SmokeTestKey read, value not printed"
          if az keyvault secret show --vault-name "$VAULT" \
            -n PartnerApiToken -o none 2>/dev/null; then
            exit 1
          fi
          echo "PartnerApiToken denied, as expected"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ledgerflow-rtg-aa
          package: out